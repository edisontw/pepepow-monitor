name: Test external PEPEPOW pools

on:
  push:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Run external pool monitor dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python monitor/external_pool_probe.py --dry-run --state /tmp/external-pools.json
