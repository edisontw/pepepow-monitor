name: Test explorer.pepepow.org API

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public API endpoints
        shell: bash
        run: |
          set -u
          for url in \
            https://explorer.pepepow.org/api/getblockcount \
            https://explorer.pepepow.org/api/getconnectioncount \
            https://explorer.pepepow.org/api/getnetworkhashps \
            https://explorer.pepepow.org/ext/getsummary; do
            echo "=== $url ==="
            tmp=$(mktemp)
            code=$(curl -L -sS --max-time 15 -A 'pepepow-monitor/1.0' -o "$tmp" -w '%{http_code}' "$url" || true)
            echo "HTTP $code"
            head -c 500 "$tmp" || true
            echo
            rm -f "$tmp"
          done
